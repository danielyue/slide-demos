<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why the better product can lose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Raleway:wght@700&display=swap" rel="stylesheet">
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --a: #1f4e8c; --b: #c46a1f; --hi: #e0b400; --ink: #111; --mute: #666; --line: #d8d8d8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); font-family: Lato, Helvetica, Arial, sans-serif; overflow: hidden; }
  .stage { position: absolute; top: 0; left: 0; width: 1600px; height: 900px; transform-origin: 0 0; display: grid; grid-template-rows: auto 1fr auto; padding: 29px 64px 27px; gap: 11px; }
  h1 { font-family: Raleway, Lato, sans-serif; font-weight: 700; font-size: 47px; margin: 0; }
  /* The canvas sits absolutely inside a box, so its pixel size can't grow the grid row (WebKit did). */
  .plot { position: relative; min-height: 0; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 32px; min-height: 63px; }
  .caption { font-size: 32px; transition: opacity .3s; }
  .nav { display: flex; align-items: center; gap: 19px; }
  .nav button { font: inherit; font-size: 31px; width: 58px; height: 58px; border: 1px solid var(--line); background: #fff; border-radius: 50%; cursor: pointer; color: var(--ink); line-height: 1; }
  .nav button:hover { border-color: #999; }
  .nav button:disabled { opacity: .3; cursor: default; }
  .dots { display: flex; gap: 11px; }
  .dots span { width: 13px; height: 13px; border-radius: 50%; background: var(--line); }
  .dots span.on { background: var(--ink); }
  body.nocap .caption { visibility: hidden; }
</style>
</head>
<body>
<div class="stage">
  <h1>Why the better product can lose</h1>
  <div class="plot"><canvas id="cv" aria-label="Users joining platform A or platform B, step by step"></canvas></div>
  <div class="foot">
    <div class="caption" id="cap"></div>
    <div class="nav">
      <button id="prev" aria-label="Previous step">&#8249;</button>
      <div class="dots" id="dots"></div>
      <button id="next" aria-label="Next step">&#8250;</button>
    </div>
  </div>
</div>
<script>
// Steps advance with the on-screen arrows, or with arrow keys, Page Down/Up and the clicker once
// the page has focus. Past the last step (or before the first) it asks PowerPoint to change slide.
// URL options: ?step=2 starts at a step; ?captions=0 hides the captions so you supply the words.
if (window.Office && Office.onReady) { try { Office.onReady(() => {}); } catch (e) {} }

const N = 120;
const CAPTIONS = [
  'B is the better product',
  'Early users choose on quality',
  'A buys a lead with a launch promotion',
  'New users follow the installed base',
  'The market tips, and some B users switch',
];
const QUALITY = { A: 0.6, B: 0.7 };
const PROMO = [12, 27];            // users who join A in the promotion step (highlighted there)

// Who is where after each step: 'none' (not arrived), 'A' or 'B'. Fixed, so going back is exact.
const STEPS = (() => {
  const s0 = Array(N).fill('none');
  const s1 = s0.slice(); for (let i = 0; i < 12; i++) s1[i] = [2, 5, 8, 11].includes(i) ? 'A' : 'B';
  const s2 = s1.slice(); for (let i = PROMO[0]; i < PROMO[1]; i++) s2[i] = 'A';
  const s3 = s2.slice(); for (let i = 27; i < 72; i++) s3[i] = i % 9 === 0 ? 'B' : 'A';
  const s4 = s3.slice(); for (let i = 72; i < N; i++) s4[i] = (i === 80 || i === 100) ? 'B' : 'A';
  [0, 1, 3, 4, 6, 7].forEach(i => { s4[i] = 'A'; });   // six early B users switch
  return [s0, s1, s2, s3, s4];
})();

const cv = document.getElementById('cv'), cap = document.getElementById('cap');
const prevB = document.getElementById('prev'), nextB = document.getElementById('next'), dotsEl = document.getElementById('dots');
const qs = new URLSearchParams(location.search);
if (qs.get('captions') === '0') document.body.classList.add('nocap');
const COL = { A: '#1f4e8c', B: '#c46a1f', hi: '#e0b400', ink: '#111', mute: '#666', line: '#d8d8d8' };

// Positions are in canvas fractions, so resizing the frame never breaks a tween.
const ENTRY = { x: 0.5, y: 0.2 };
function seat(i, side) {
  const x0 = side === 'A' ? 0.04 : 0.54, cols = 10, rows = 12, cw = 0.42 / cols, ch = 0.66 / rows;
  return { x: x0 + (i % cols + 0.5) * cw, y: 0.31 + (Math.floor(i / cols) + 0.5) * ch };
}
// Seats fill in the order users joined each side, so the grids stay compact.
const SEATS = STEPS.map((st, k) => {
  const joined = i => { let j = k; while (j > 0 && STEPS[j - 1][i] === st[i]) j--; return j; };
  const out = Array(N).fill(-1);
  ['A', 'B'].forEach(side => {
    st.map((x, i) => i).filter(i => st[i] === side)
      .sort((a, b) => joined(a) - joined(b) || a - b)
      .forEach((i, r) => { out[i] = r; });
  });
  return out;
});
function place(i, k) { const s = STEPS[k][i]; return s === 'none' ? { ...ENTRY, a: 0 } : { ...seat(SEATS[k][i], s), a: 1 }; }

let step = 0;
const users = STEPS[0].map((s, i) => { const p = place(i, 0); return { from: p, to: p, t0: 0, dur: 1 }; });

function goTo(k, animate = true) {
  const forward = k > step, now = performance.now();
  const changed = [];
  STEPS[k].forEach((s, i) => { if (s !== STEPS[step][i] || SEATS[k][i] !== SEATS[step][i] || !animate) changed.push(i); });
  const spread = !animate ? 0 : forward ? Math.min(2600, changed.length * 55) : 350;
  changed.forEach((i, r) => {
    const u = users[i];
    u.from = current(u, now);
    u.to = place(i, k);
    u.t0 = now + (changed.length > 1 ? (r / (changed.length - 1)) * spread : 0);
    u.dur = animate ? 700 : 1;
  });
  step = k;
  cap.textContent = CAPTIONS[k];
  dotsEl.innerHTML = CAPTIONS.map((_, j) => `<span class="${j === k ? 'on' : ''}"></span>`).join('');
  prevB.disabled = false; nextB.disabled = false;
}
function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
function current(u, now) {
  const t = Math.min(1, Math.max(0, (now - u.t0) / u.dur)), e = ease(t);
  return { x: u.from.x + (u.to.x - u.from.x) * e, y: u.from.y + (u.to.y - u.from.y) * e, a: u.from.a + (u.to.a - u.from.a) * e };
}

function officeNav(dir) {
  try {
    if (window.Office && Office.context && Office.context.document && Office.context.document.goToByIdAsync) {
      Office.context.document.goToByIdAsync(dir > 0 ? Office.Index.Next : Office.Index.Previous, Office.GoToType.Index, () => {});
    }
  } catch (e) {}
}
function next() { step < STEPS.length - 1 ? goTo(step + 1) : officeNav(1); }
function prev() { step > 0 ? goTo(step - 1) : officeNav(-1); }

function draw(now) {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1, w = r.width, h = r.height;
  if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
  const ctx = cv.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, w, h);
  const fs = Math.max(11, h * 0.06), small = fs * 0.7;
  const count = s => STEPS[step].filter(x => x === s).length;

  ['A', 'B'].forEach(s => {
    const x0 = (s === 'A' ? 0.04 : 0.54) * w, bw = 0.42 * w;
    ctx.fillStyle = COL[s]; ctx.font = `700 ${fs}px Lato, sans-serif`;
    ctx.fillText(`Platform ${s}`, x0, h * 0.08);
    const n = count(s), label = `${n} users`;
    ctx.font = `${fs * 0.85}px Lato, sans-serif`; ctx.fillStyle = COL.ink;
    ctx.fillText(label, x0 + bw - ctx.measureText(label).width, h * 0.08);
    ctx.font = `${small}px Lato, sans-serif`; ctx.fillStyle = COL.mute;
    ctx.fillText('Quality', x0, h * 0.175);
    const bx = x0 + small * 4.6, bl = bw - small * 4.6;
    ctx.fillStyle = COL.line; ctx.fillRect(bx, h * 0.15, bl, h * 0.03);
    ctx.fillStyle = COL[s]; ctx.fillRect(bx, h * 0.15, bl * QUALITY[s], h * 0.03);
  });

  const rad = Math.min(0.42 * w / 10, 0.66 * h / 12) * 0.34;
  users.forEach((u, i) => {
    const p = current(u, now); if (p.a <= 0.01) return;
    const colr = p.x < 0.5 ? COL.A : COL.B;
    ctx.globalAlpha = p.a;
    ctx.beginPath(); ctx.arc(p.x * w, p.y * h, rad, 0, Math.PI * 2); ctx.fillStyle = colr; ctx.fill();
    if (step === 2 && i >= PROMO[0] && i < PROMO[1]) {
      ctx.beginPath(); ctx.arc(p.x * w, p.y * h, rad * 1.45, 0, Math.PI * 2);
      ctx.strokeStyle = COL.hi; ctx.lineWidth = Math.max(1.5, rad * 0.35); ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

prevB.addEventListener('click', prev);
nextB.addEventListener('click', next);
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
});
const startStep = Math.min(STEPS.length - 1, Math.max(0, parseInt(qs.get('step') || '0', 10) || 0));
goTo(startStep, false);
requestAnimationFrame(draw);

// Lay out at a fixed 1600x900 and scale to the frame. In slideshow, PowerPoint for Mac can report a
// window height far larger than what is visible, so the height is used only when it looks like 16:9.
// Press D (or open with ?debug=1) to show the sizes the page sees.
(function () {
  const stage = document.querySelector('.stage');
  const dbg = document.createElement('div');
  dbg.style.cssText = 'position:fixed;left:4px;top:4px;font:14px monospace;background:#ffe;z-index:9;padding:2px 6px';
  dbg.hidden = new URLSearchParams(location.search).get('debug') !== '1';
  document.body.appendChild(dbg);
  document.addEventListener('keydown', e => { if (e.key === 'd' || e.key === 'D') dbg.hidden = !dbg.hidden; });
  function fit() {
    const w = document.documentElement.clientWidth || innerWidth, h = document.documentElement.clientHeight || innerHeight;
    let k = w / 1600;
    const ratio = h / w;
    if (ratio > 0.45 && ratio < 0.62) k = Math.min(k, h / 900);
    const left = Math.max(0, (w - 1600 * k) / 2);
    stage.style.transform = `translate(${left}px, 0) scale(${k})`;
    dbg.textContent = `client ${w}x${h}  inner ${innerWidth}x${innerHeight}  dpr ${devicePixelRatio}  k ${k.toFixed(3)}`;
  }
  addEventListener('resize', fit); fit(); setInterval(fit, 1000);
})();
</script>
</body>
</html>
